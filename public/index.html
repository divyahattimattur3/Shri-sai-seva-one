<div class="stats">${st(R.waiting.payments,"Payments to verify")}${st(R.waiting.applications,"Applications pending")}${st(R.waiting.tickets,"Open tickets")}${st(inr(R.liabilities.wallets),"Retailer wallet balances now")}${st(inr(R.liabilities.earnings),"Earnings wallets now")}${st((R.liabilities.retailers-R.liabilities.disabled)+" / "+R.liabilities.retailers,"Active retailers")}</div>
<div class="card" style="max-width:none">${repChart(R.daily)}</div>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card tw"><h3>Top services</h3>${tbl(["Service","Orders","Fees"],R.topServices.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.count}</td><td>${inr(x.fee)}</td></tr>`).join(""))}</div><div class="card tw"><h3>Top retailers</h3>${tbl(["Retailer","Orders","Fees"],R.topRetailers.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.count}</td><td>${inr(x.fee)}</td></tr>`).join(""))}</div></div>
<div class="card" style="max-width:none;margin-top:12px"><h3>Download (CSV for Excel)</h3><p style="margin:0"><a class="btn sm" href="/api/admin/export/applications?${q}">Applications</a> <a class="btn sm" href="/api/admin/export/payments?${q}">Payments</a> <a class="btn sm" href="/api/admin/export/transactions?${q}">Transactions</a> <a class="btn sm" href="/api/admin/export/retailers">Retailers</a></p><p style="font-size:12px;color:var(--mu);margin-bottom:0">Exports contain customers’ personal details. Keep them private. Each download is recorded in the audit log.</p></div>`}
function audRows(){const q=AUD.q.toLowerCase();return DB.l.filter(x=>(!AUD.a||x.action===AUD.a)&&(!q||(x.actor+" "+x.detail+" "+x.action).toLowerCase().includes(q))).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.actor)}</td><td><span class="st">${esc(x.action)}</span></td><td>${esc(x.detail)}</td></tr>`).join("")||'<tr><td colspan="4">No matching entries.</td></tr>'}
function vAdAudit(){const acts=[...new Set(DB.l.map(x=>x.action))].sort();return `<h2>Audit log</h2><p class="note" style="max-width:680px">Sensitive admin actions are recorded here (latest 300). Entries cannot be edited from the website.</p><div class="card tw"><div class="row" style="gap:10px;justify-content:flex-start;flex-wrap:wrap;margin-bottom:8px"><select id="aa" style="width:auto" onchange="AUD.a=this.value;$('ab').innerHTML=audRows()"><option value="">All actions</option>${acts.map(a=>`<option ${a===AUD.a?"selected":""}>${esc(a)}</option>`).join("")}</select><input id="aq" placeholder="Search…" value="${esc(AUD.q)}" style="width:220px" oninput="AUD.q=this.value;$('ab').innerHTML=audRows()"><a class="btn sm" href="/api/admin/export/audit">Export CSV</a></div><table><tr><th>When</th><th>Who</th><th>Action</th><th>Details</th></tr><tbody id="ab">${audRows()}</tbody></table></div>`}


/* ===== Forgot password without SMS (admin-assisted), forced new password, profile without OTP ===== */
async function fgS(){const r=await api("/api/forgot/start",{id:FU});if(!r.ok)return toast(r.d.error||"Could not send the request.");
if(CFG.resetMethod==="otp"){toast(CFG.smsDemo?"Demo mode: the OTP is printed in the server window.":"If the account exists, an OTP has been sent to the registered mobile.",7000);RA=Date.now()+120000}
view="reset";rs()}
function rstSentH(){return `<div class="auth">${authTop("login")}<div class="acard"><h2>Request sent ✔</h2><p>If an account matches <b>${esc(FU)}</b>, the administrator has been notified.</p><p>They will contact you on your registered mobile number and give you a temporary password. You will be asked to choose a new password the first time you log in.</p><p style="color:var(--mu);font-size:13px">Need help sooner? Call <a href="tel:+91${esc(ADMIN.mobile)}">${esc(ADMIN.mobile)}</a>.</p><button class="btn w" onclick="FU='';V('login')">← Back to Login</button></div></div>`}
function rstH(){return fgH()}
function vProf(u){return `<h2>Profile</h2><div class="card" style="max-width:560px"><label>Full name</label><input id="pn" value="${esc(u.name)}"><label>Mobile number</label><input id="pm" value="${esc(u.mobile)}" maxlength="10" inputmode="numeric"><label>Email</label><input id="pe" value="${esc(u.email)}"><label>State</label><select id="ps">${STATES.map(s=>`<option ${s===u.state?"selected":""}>${s}</option>`).join("")}</select><label>Username</label><input id="pu" value="${esc(u.username||"")}" placeholder="Choose a username"><label>New password (leave blank to keep)</label>${pwf("pp","New password")}<label>Confirm new password</label>${pwf("pq","Confirm new password")}<label>Current password <small style="color:var(--mu)">(only needed to change your mobile number, email or password)</small></label>${pwf("pc","Current password")}<div class="err" id="er"></div><button class="btn" style="background:#173a8c" onclick="saveP()">SAVE</button></div>`}
async function saveP(){const u=me(),n=$("pn").value.trim(),m=$("pm").value.trim(),e=$("pe").value.trim(),un=$("pu").value.trim(),p=$("pp").value,c=$("pc").value,E=x=>$("er").textContent=x;
if(n.length<3)return E("Enter your full name.");if(!/^[6-9]\d{9}$/.test(m))return E("Enter a valid 10-digit mobile number.");if(!/^\S+@\S+\.\S+$/.test(e))return E("Enter a valid email.");
if(p){if(pwProblem(p))return E(pwProblem(p));if(p!==$("pq").value)return E("Passwords do not match.")}
if((m!==u.mobile||e.toLowerCase()!==u.email.toLowerCase()||p)&&!c)return E("Enter your current password to change your mobile number, email or password.");
const r=await api("/api/profile",{name:n,mobile:m,email:e,username:un,state:$("ps").value,password:p,current:c});if(!r.ok)return E(r.d.error||"Could not save.");await refresh();toast("Profile saved ✔");rs()}
function vAdReset(){return `<h2>Password requests</h2><p class="note" style="max-width:720px">A retailer who forgot their password appears here. <b>Make sure it is really them</b> (call them back on their registered number), then press <b>Set temporary password</b> and tell it to them. They must choose a new password when they next log in.</p><div class="card tw"><table><tr><th>When</th><th>Retailer</th><th>Mobile</th><th>Email</th><th></th></tr>${DB.r.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.name)}</td><td>${esc(r.mobile)}</td><td>${esc(r.email)}</td><td><button class="btn sm" onclick="rst1(${r.id})">Set temporary password</button> <button class="btn sm gh" onclick="rst2(${r.id})">Dismiss</button></td></tr>`).join("")||'<tr><td colspan="5">No requests right now.</td></tr>'}</table></div>`}
function rst1(id){const r=DB.r.find(x=>x.id===id);modal(`<h3>Reset password for ${esc(r.name)}?</h3><p>Their current password stops working and they are signed out. Continue only after you have confirmed it is really ${esc(r.name)} (${esc(r.mobile)}).</p><p><button class="btn rd" onclick="rst3(${id})">Yes, set temporary password</button> <button class="btn gh" onclick="cm()">Cancel</button></p>`)}
async function rst3(id){const r=await api("/api/admin/resets/"+id+"/issue",{});if(!r.ok){cm();return toast(r.d.error||"Failed")}await refresh();
modal(`<h3>Temporary password for ${esc(r.d.name)}</h3><p id="tp" style="font-size:28px;font-weight:800;letter-spacing:1px;margin:10px 0;word-break:break-all;user-select:all">${esc(r.d.password)}</p><p>Tell this to <b>${esc(r.d.name)}</b> (${esc(r.d.mobile)}) by phone or WhatsApp. <b>It is shown only once.</b> They will be asked to choose a new password at their next login.</p><p><button class="btn gh" onclick="cp('${esc(r.d.password)}')">Copy</button> <button class="btn" onclick="cm()">Done</button></p>`);rs()}
async function rst2(id){await api("/api/admin/resets/"+id+"/dismiss",{});await refresh();rs()}

boot();
</script></body></html>
